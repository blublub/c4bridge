<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>c4bridge · Anmelden</title>
<link rel="stylesheet" href="/ui/core.css">
<script src="/ui/i18n.js"></script>
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .loginbox { width: min(380px, 92vw); padding: 30px 28px; border-radius: 24px; }
  .loginbox h1 { margin: 0 0 4px; font-size: 24px; font-weight: 600; }
  .loginbox p { margin: 0 0 22px; color: var(--dim); font-size: 14px; }
  .loginbox label { display: block; font-size: 12.5px; color: var(--dim); margin: 14px 0 6px; }
  .loginbox input { width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--line);
    background: rgba(255,255,255,.06); color: var(--txt); font: inherit; padding: 0 14px; }
  .loginbox input:focus { outline: 2px solid rgba(122,162,255,.6); }
  .loginbox button { width: 100%; height: 48px; margin-top: 24px; border: 0; border-radius: 14px;
    background: #fff; color: #1a1b24; font: 600 15px/1 inherit; cursor: pointer; }
  .loginbox button:disabled { opacity: .5; }
  #msg { min-height: 20px; margin-top: 14px; font-size: 13.5px; color: var(--err); }
</style>
</head>
<body class="x4bg">
<form class="loginbox glass" id="f">
  <h1>c4bridge</h1>
  <p>Bitte anmelden</p>
  <label for="u">Benutzer</label>
  <input id="u" autocomplete="username" autofocus required>
  <label for="p">Passwort</label>
  <input id="p" type="password" autocomplete="current-password" required>
  <button id="b">Anmelden</button>
  <div id="msg"></div>
</form>
<script>
const next = new URLSearchParams(location.search).get('next') || '/';
const safeNext = next.startsWith('/') && !next.startsWith('//') ? next : '/';
fetch('/api/me').then(r => r.json()).then(m => { if (m.authenticated) location.replace(safeNext); });
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const b = document.getElementById('b'), msg = document.getElementById('msg');
  b.disabled = true; msg.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: document.getElementById('u').value, password: document.getElementById('p').value }) });
    if (r.ok) { location.replace(safeNext); return; }
    const j = await r.json().catch(() => ({}));
    msg.textContent = c4tr(j.detail || 'Anmeldung fehlgeschlagen');
  } catch (err) { msg.textContent = c4tr('Bridge nicht erreichbar'); }
  b.disabled = false;
});
</script>
</body>
</html>
