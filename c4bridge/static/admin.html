<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>c4bridge · Admin</title>
<script src="/vendor/icons.js?v=3"></script>
<script src="/ui/i18n.js"></script>
<script src="/ui/learn.js" defer></script>
<style>
  /* ---- Design-Tokens: X4-Look wie die Bedienoberfläche (dunkel, Glas, blauer Akzent) */
  :root {
    --bg: #0b0e14; --panel: rgba(26, 29, 36, .82); --field: rgba(44, 48, 58, .6);
    --text: #f2f2f4; --muted: #a6adb8;
    --line: rgba(255, 255, 255, .12); --accent: #5b9cff; --accent-soft: rgba(91, 156, 255, .16);
    --ok: #46c07a; --warn: #e0a23c; --err: #ff6b5e;
    --h: 36px; --r: 16px; --rs: 8px;
  }
  * { box-sizing: border-box; }
  .ic { display: inline-block; vertical-align: -3px; }
  .geo { position: relative; display: inline-block; }
  .geo-dd { position: absolute; top: calc(100% + 4px); left: 0; min-width: 100%; z-index: 30; max-height: 280px; overflow: auto;
            background: #1a1e27; border: 1px solid var(--line); border-radius: var(--rs); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .geo-dd div { padding: 8px 12px; cursor: pointer; white-space: nowrap; }
  .geo-dd div span { color: var(--muted); font-size: 12px; }
  .geo-dd div:hover, .geo-dd div.sel { background: var(--accent-soft); }
  .geo-dd .none { color: var(--muted); cursor: default; }
  body { margin: 0; color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         /* gleiche Control4-navy-Basis mit blauen Verlaufs-Lichtern wie Startseite/OS3 */
         background-color: #0b0e14;
         background-image:
           radial-gradient(120% 90% at 85% -10%, #1c3f74 0%, transparent 55%),
           radial-gradient(110% 80% at -10% 110%, #14294e 0%, transparent 55%),
           linear-gradient(170deg, #101724 0%, #0b0e14 60%, #0e1626 100%);
         background-attachment: fixed; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .18); border-radius: 5px; }

  /* ---- Kopfzeile / Tabs -------------------------------------------------------- */
  header { display: flex; align-items: center; gap: 20px; padding: 10px 20px; flex-wrap: wrap;
           background: rgba(20, 23, 30, .85); border-bottom: 1px solid var(--line);
           backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
           position: sticky; top: 0; z-index: 5; }
  h1 { font-size: 16px; margin: 0; font-weight: 700; }
  h1 b { color: var(--accent); font-weight: 700; }
  nav { display: flex; gap: 2px; flex-wrap: wrap; }
  nav button { background: none; border: 0; padding: 9px 13px; border-radius: var(--rs); color: var(--muted);
               font: inherit; font-weight: 500; cursor: pointer; }
  nav button:hover { color: var(--text); background: var(--field); }
  nav button.on { color: var(--accent); background: var(--accent-soft); }
  header .act { margin-left: auto; }
  [hidden] { display: none !important; }   /* .act/.panel setzen display – hidden muss gewinnen */
  header .who { color: var(--muted); font-size: 13px; }
  header .who + .act { margin-left: 0; }
  .drybar { padding: 10px 12px; border-radius: var(--rs); background: rgba(70,192,122,.10); border: 1px solid rgba(70,192,122,.35); }
  .drybar.live { background: rgba(255,107,94,.12); border-color: rgba(255,107,94,.55); }
  .drybar.live b { color: var(--err); }

  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 32px; }

  /* ---- Flächen ------------------------------------------------------------------ */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
           padding: 20px; margin-bottom: 16px;
           backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); }
  .card { background: rgba(15, 18, 25, .5); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px 16px; }
  h2.sec { font-size: 12px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase;
           letter-spacing: .05em; font-weight: 600; }
  .sect { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line); }
  .sect > h2.sec:first-child { margin-top: 0; }
  .hint { font-size: 13px; color: var(--muted); }
  .muted { color: var(--muted); } .small { font-size: 13px; }

  /* ---- Eingaben: ALLE Typen gleiche Höhe/Radius/Farben -------------------------- */
  input:not([type=checkbox]):not([type=radio]):not([type=range]), select {
    height: var(--h); padding: 0 10px; border: 1px solid rgba(255, 255, 255, .2); border-radius: var(--rs);
    background: var(--field); color: var(--text); min-width: 0; font: inherit;
  }
  input::placeholder { color: var(--muted); }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[type=number] { width: 110px; }
  input[type=checkbox], input[type=radio] { width: 16px; height: 16px; accent-color: var(--accent); }
  input[type=range] { accent-color: var(--accent); }

  /* ---- Buttons: eine Höhe, drei Varianten --------------------------------------- */
  .act { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
         height: var(--h); padding: 0 14px; border-radius: var(--rs);
         border: 1px solid var(--line); background: var(--field); color: var(--text);
         font: inherit; font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .act:hover { border-color: rgba(255, 255, 255, .35); color: var(--text); }
  .act:disabled { opacity: .5; cursor: default; }
  .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .primary:hover { color: #fff; filter: brightness(1.08); }
  .danger { color: var(--err); }
  .danger:hover { border-color: var(--err); color: var(--err); }
  .ib { width: 32px; height: 32px; padding: 0; border-radius: 7px; font-size: 13px; }

  /* ---- Zeilen / Formulare / Werkzeugleisten ------------------------------------- */
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .toolbar input[type=search] { flex: 1 1 240px; max-width: 340px; width: auto; }
  .toolbar select { width: auto; }
  .spacer { margin-left: auto; }
  .frm { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 12px 16px; align-items: center; }
  .frm .fl { color: var(--muted); font-size: 14px; }
  .frm .ctr { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
  .frm .ctr > input:not([type=checkbox]):not([type=number]):not([type=range]):first-child { flex: 1 1 200px; width: auto; }
  details.adv { margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  details.adv summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  details.adv[open] summary { margin-bottom: 8px; }
  details.hintbox { background: rgba(122,162,255,.10); border-color: rgba(122,162,255,.45); }
  details.hintbox summary { color: var(--text, inherit); font-weight: 600; }
  details.hintbox textarea { width: 100%; box-sizing: border-box; background: rgba(122,162,255,.08); }
  details.adv textarea { width: 100%; box-sizing: border-box; margin: 6px 0; font: 12.5px/1.45 ui-monospace, Consolas, monospace;
    background: var(--field); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px; resize: vertical; }
  details.adv .fl { display: block; margin-top: 10px; }
  .savebar { position: sticky; top: 64px; z-index: 6; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    margin: 0 0 16px; padding: 10px 12px; border-radius: 12px; background: rgba(20,24,32,.94); border: 1px solid var(--line); }
  .sect .savebar { margin-top: 4px; }
  .stickybar { position: sticky; bottom: 0; z-index: 5; background: linear-gradient(transparent, var(--bg, #10131b) 30%); padding-top: 18px !important; }
  @media (max-width: 640px) { .frm { grid-template-columns: 1fr; } .frm .fl { margin-bottom: -6px; } }

  /* ---- Segmented Control (Config-Untermenüs) ------------------------------------ */
  .seg { display: inline-flex; background: rgba(15, 18, 25, .5); border: 1px solid var(--line);
         border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; margin-bottom: 16px; }
  .seg button { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 500;
                padding: 7px 14px; border-radius: 7px; cursor: pointer; }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--panel); color: var(--accent); }

  /* ---- Einrichtung: Menü links; ein Bereich mit Unterpunkten ersetzt die Liste (oben „Zurück“) ---------------- */
  main:has(#t-config:not([hidden])) { max-width: 1340px; }
  .cfgwrap { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; align-items: start; }
  .cfgnav { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 2px; padding: 8px;
            background: rgba(15, 18, 25, .5); border: 1px solid var(--line); border-radius: 12px; }
  .cfgnav button { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 500; text-align: left;
                   padding: 9px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .cfgnav button:hover { color: var(--text); background: rgba(255, 255, 255, .04); }
  .cfgnav button.on { background: var(--panel); color: var(--accent); }
  .cfgnav button .more { margin-left: auto; opacity: .6; }
  .cfgnav .back { color: var(--text); border-bottom: 1px solid var(--line); border-radius: 8px 8px 0 0; margin-bottom: 4px; }
  .cfgnav .navh { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 12px 4px; }
  @media (max-width: 800px) { .cfgwrap { grid-template-columns: 1fr; }
    .cfgnav { position: static; flex-direction: row; flex-wrap: wrap; } .cfgnav .navh { display: none; } }

  /* ---- Status-Kacheln ------------------------------------------------------------ */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .stat { background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .stat .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .stat .v { font-size: 20px; font-weight: 650; margin: 3px 0 2px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .ok { background: var(--ok); } .bad { background: var(--err); }
  .dot.wait { background: var(--amber, #ffd166); }

  /* ---- Tabellen ------------------------------------------------------------------ */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  th { color: var(--muted); font-size: 12px; font-weight: 600; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--field);
         border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  /* Wake-Modell-Chips: grün = geladen, rot = Fehler, gelb = lädt beim ersten Audio */
  .wchip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px; border-radius: 999px;
           border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .wchip.good { color: var(--ok); border-color: var(--ok); }
  .wchip.bad { color: var(--err); border-color: var(--err); }
  .wchip.wait { color: var(--warn); border-color: var(--warn); }
  .scroll { overflow-x: auto; }
  .dgrp { border-top: 1px solid var(--line); }
  .dgh { display: flex; gap: 8px; align-items: baseline; width: 100%; padding: 10px 4px; background: none; border: 0;
         color: var(--text); font: inherit; font-weight: 600; cursor: pointer; text-align: left; }
  .dgh:hover { color: var(--accent); }
  .dgh .tw { width: 12px; color: var(--muted); }
  code { font-size: 12.5px; color: #cfe1ff; }
  #t-devices a, .learn a { color: var(--accent); text-decoration: none; } #t-devices a:hover, .learn a:hover { text-decoration: underline; }
  #t-devices td input[type=text] { width: 100%; min-width: 120px; } #t-devices td select { min-width: 0; width: 110px; }
  #t-devices td, #t-devices th { padding-left: 6px; padding-right: 6px; }
  .learn { border-color: rgba(91, 156, 255, .45); }
  .learn .lsub { font-size: 14px; margin: 16px 0 6px; color: var(--muted); font-weight: 600; }
  .learn .lmap { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; font-size: 12.5px; }
  .learn .lmap select { height: 28px; padding: 0 6px; }
  .learn td, .learn th { vertical-align: top; }
  .learn tr.lchg td { background: rgba(70, 192, 122, .07); }

  /* ---- Schalter ------------------------------------------------------------------- */
  .sw { position: relative; display: inline-block; width: 44px; height: 25px; flex: 0 0 auto; }
  .sw input { display: none; }
  .sw i { position: absolute; inset: 0; border-radius: 999px; background: rgba(255, 255, 255, .16); transition: .18s; cursor: pointer; }
  .sw i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px;
                 border-radius: 50%; background: #fff; transition: .18s; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
  .sw input:checked + i { background: var(--accent); }
  .sw input:checked + i::after { left: 22px; }

  /* ---- Log ------------------------------------------------------------------------- */
  #log { font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
         max-height: 70vh; overflow: auto; background: rgba(10, 12, 17, .65);
         border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .l-WARN { color: var(--warn); } .l-ERROR { color: var(--err); }

  /* ---- Projektdaten (Baum): zwei unabhängig scrollende Spalten --------------------- */
  .treewrap { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 16px; align-items: start; }
  .treewrap > .panel { max-height: calc(100vh - 160px); overflow-y: auto; position: sticky; top: 76px; }
  @media (max-width: 800px) { .treewrap { grid-template-columns: 1fr; }
    .treewrap > .panel { position: static; max-height: none; }
    .treewrap > .panel:first-child { max-height: 45vh; } }
  .treelist { max-height: 72vh; overflow: auto; margin-top: 8px; }
  .tflo { display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
          font-weight: 600; margin: 14px 0 2px; color: var(--muted); font-size: 12px;
          text-transform: uppercase; letter-spacing: .04em; font-family: inherit; padding: 4px 0; }
  .tflo:hover, .troom:hover { color: var(--text); }
  .tw { display: inline-block; width: 14px; color: var(--accent); }
  .troom { display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
           margin: 6px 0 2px 6px; font-weight: 600; font-size: 14px; padding: 4px 0; font-family: inherit;
           color: var(--text); }
  .troom .small { font-weight: 400; }
  .tdev { display: block; width: 100%; text-align: left; background: none; border: 0;
          border-radius: var(--rs); padding: 5px 8px; cursor: pointer; font: inherit; color: var(--text); }
  .tdev:hover { background: var(--field); }
  .tdev.sel { background: var(--accent); color: #fff; }
tr.poll > td { background: rgba(224,162,60,.16); }
.tag.ok { color: var(--ok); border-color: var(--ok); } .tag.warn { color: var(--warn); border-color: var(--warn); }
.pushbox { display: grid; gap: 6px; padding: 8px 4px 12px; font-size: 13px; }
.pushbox > div > .hint:first-child { display: inline-block; min-width: 130px; }
</style>
</head>
<body>
<header>
  <h1>c4<b>bridge</b> · Admin</h1>
  <nav id="nav">
    <button data-t="status" class="on">Status</button>
    <button data-t="config">Einrichtung</button>
    <button data-t="tree">Projektdaten</button>
    <button data-t="log">Log</button>
  </nav>
  <a href="/" class="act" title="Zur Bedienoberfläche">&#8962; Start</a>
  <button class="act" data-notr title="Deutsch / English" onclick="c4SetLang(C4LANG === 'en' ? 'de' : 'en')"><script>document.write(C4LANG === 'en' ? 'DE' : 'EN')</script></button>
  <span class="who" id="whoami"></span>
  <button class="act" id="logoutbtn" onclick="logout()" hidden>Abmelden</button>
</header>
<main>
  <section id="t-status"></section>
  <section id="t-media" hidden></section>
  <section id="t-log" hidden><div class="panel"><div id="log"></div></div></section>
  <section id="t-tree" hidden></section>
  <section id="t-config" hidden></section>
</main>

<script>
const $ = (s, r = document) => r.querySelector(s);
const api = (path, opts) => fetch(path, opts).then(r => {
  if (r.status === 401) { location.href = '/login?next=/admin'; throw new Error('nicht angemeldet'); }
  return r.ok ? r.json() : r.text().then(t => { let m = t; try { m = JSON.parse(t).detail || t; } catch { } throw new Error(m); });
});
async function logout() { await post('/api/logout'); location.href = '/login'; }
fetch('/api/me').then(r => r.json()).then(m => {
  if (!m.authenticated) return;
  $('#whoami').textContent = m.open_mode ? '⚠ kein Login eingerichtet (offen im Netz)' : `angemeldet: ${m.user} (${m.role})`;
  $('#logoutbtn').hidden = !!m.open_mode;
});
const put = (path, body) => api(path, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
const post = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = ts => ts ? new Date(ts * 1000).toLocaleString('de-DE') : '–';

// ---- tabs
let current = 'status';
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => show(b.dataset.t));
function show(t) {
  current = t;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  ['status', 'media', 'log', 'config', 'tree'].forEach(x => $('#t-' + x).hidden = x !== t);
  if (t === 'status') loadStatus();
  if (t === 'tree') { loadTree(); $('#t-media').hidden = false; renderMedia(); }
  if (t === 'config') loadConfig();
}

// ---- status
async function loadStatus() {
  const s = await api('/api/status'), c = s.control4;
  const html = `<div class="grid">
      <div class="stat"><div class="k">Control4</div>
        <div class="v"><span class="dot ${c.connected ? 'ok' : 'bad'}"></span>${c.connected ? 'verbunden' : (c.configured ? 'getrennt' : 'nicht konfiguriert')}</div>
        <div class="hint">${esc(c.controller)} ${esc(c.ip)}</div></div>
      <div class="stat"><div class="k">Token läuft ab in</div><div class="v">${Math.round(c.token_expires_in / 60)} min</div>
        <div class="hint">Login ${ago(c.last_login)}</div></div>
      <div class="stat"><div class="k">Räume / Geräte</div><div class="v">${s.inventory.rooms} / ${s.inventory.devices}</div>
        <div class="hint">Import ${ago(s.inventory.imported_at)}</div></div>
      <div class="stat"><div class="k">Musik</div><div class="v">${s.media.albums} Alben · ${s.media.songs} Titel</div>
        <div class="hint">${s.media.loading ? `lädt ${s.media.progress[0]}/${s.media.progress[1]}` : 'Stand ' + ago(s.media.loaded_at)}</div></div>
    </div>
    ${c.last_error ? `<p class="small" style="color:var(--err);margin-bottom:0">${esc(c.last_error)}</p>` : ''}`;
  if (!$('#st-grid')) $('#t-status').innerHTML = `<div class="panel" id="st-grid"></div>
    <div class="panel toolbar" style="margin-bottom:0">
      <button class="act primary" onclick="refresh('inventory')">Geräte neu importieren</button>
      <button class="act" onclick="refresh('media')">Musikbibliothek neu laden</button>
      <span class="hint spacer">BluOS, KODI → Einrichtung › Module · Geräte → Einrichtung › Geräte</span>
    </div>`;
  const g = $('#st-grid');
  if (g.dataset.sig !== html) { g.dataset.sig = html; g.innerHTML = html; }
}

// ---- BluOS: Selbstkonfiguration (Player ↔ Control4-Treiber ↔ Raum, Musikquellen, Hinweise)
async function loadBlu(btn) {
  const el = $('#blu'); if (!el) return;
  let b;
  try { b = btn ? await post('/api/bluos/refresh') : await api('/api/bluos/players'); }
  catch (e) { el.innerHTML = `<span class="hint">BluOS: ${esc(e.message)}</span>`; return; }
  const devs = (b.devices || []).slice().sort((x, y) => (x.name || '').localeCompare(y.name || ''));
  if (!devs.length && !(b.drivers || []).length) { el.hidden = true; return; }
  const rooms = Object.entries(b.rooms || {}).sort((x, y) => (x[1].room || '').localeCompare(y[1].room || ''));
  const svcName = id => (b.services[id] || {}).name || id;
  const keyTxt = k => String(k || '').replace(/:$/, '').replace('LocalMusic', 'Bibliothek').replace(/^BluOS$/, 'Playlists');
  const drv = mac => (b.drivers || []).find(x => x.mac === mac);
  el.innerHTML = `
    <div class="toolbar"><h2 class="sec" style="margin:0">BluOS-Player (automatisch erkannt)</h2>
      <span class="hint">Stand ${ago(b.updated)}</span>
      <button class="act spacer" onclick="this.disabled=true;this.textContent='erkenne …';loadBlu(this)">Neu erkennen</button></div>
    ${(b.warnings || []).length ? `<div class="pushbox" style="margin:8px 0"><b>Hinweise</b><ul style="margin:6px 0 0 18px;padding:0">
      ${b.warnings.map(w => `<li class="small">${esc(w)}</li>`).join('')}</ul></div>` : ''}
    <div class="scroll"><table>
      <tr><th>Raum</th><th>Player</th><th>Zuordnung</th><th>Lautstärke</th><th>Control4-Quellen → BluOS-Dienst</th></tr>
      ${rooms.map(([rid, r]) => `<tr><td>${esc(r.room || rid)}<div class="hint">#${rid}</div></td>

const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* privat */ } };
let dgKeys = [];
let devGroup = lsGet('c4devgroup', 'room'), devOpen = new Set(lsGet('c4devopen', [])), devMore = lsGet('c4devmore', false);
async function loadDevices() {

function devGroupKey(d) {
  return devGroup === 'driver' ? (d.driver || d.proxy || '–') : devGroup === 'type' ? d.type : (d.room || '–');
}
async function devIgnore(driver, on) {

function toggleDevGroup(k) { devOpen.has(k) ? devOpen.delete(k) : devOpen.add(k); lsSet('c4devopen', [...devOpen]); renderDevices(); }
function setDevGroup(g) { devGroup = g; lsSet('c4devgroup', g); renderDevices(); }
function devAll(open) { dgKeys.filter(k => k.startsWith('d:')).forEach(k => open ? devOpen.add(k) : devOpen.delete(k)); lsSet('c4devopen', [...devOpen]); renderDevices(); }

  list.forEach(d => (groups[devGroupKey(d)] ||= []).push(d));

      <td><a href="#" onclick="event.preventDefault();L.open(${d.id})" title="untersuchen">${esc(d.name)}</a>${d.driver_wrapper ? ' <span class="tag">Treiber</span>' : ''}<div class="hint">#${d.id}</div></td>
      ${devGroup !== 'room' ? `<td>${esc(d.room)}</td>` : ''}

      <td><code>${esc(d.proxy || '')}</code>${d.how === 'driver' ? ' <span class="tag warn" title="Allerwelts-Proxy – Typ über den Treiber-Dateinamen">über Treiber</span>' : ''}<div class="hint">${esc(d.driver || '')}</div></td>

  const oRow = i => `<tr><td>${esc(i.name)}<div class="hint">#${i.id}${i.parent && i.parent !== i.id ? ' · gehört zu #' + i.parent : ''}</div></td>

        <label class="hint"><input type="checkbox" id="f-hide" ${ho ? 'checked' : ''} onchange="renderDevices()"> nur aktive</label>
        <button class="act" onclick="devAll(true)">alle auf</button>

        <button class="act primary" onclick="saveAllDevices(this)">Speichern</button>

        || '<p class="hint">keine Geräte</p>'}
      <p class="hint" style="margin:10px 0 0">Name anklicken = Gerät untersuchen (Variablen, Befehle, Push-Mitschnitt). Erkannt wird über den Control4-Proxy;
        „über Treiber“ = Allerwelts-Proxy, Typ kommt aus dem Treiber-Dateinamen.</p>
    </div>
    <div class="panel">
      <button class="dgh" onclick="devMore=!devMore;lsSet('c4devmore',devMore);renderDevices()"><span class="tw">${devMore || q ? '▾' : '▸'}</span>
        <b>Weitere Control4-Items</b> <span class="hint">${others.length} · von der Bridge nicht als Gerät geführt (Module, Agenten, Quellen, Bedienteile, Kandidaten)</span></button>
      ${devMore || q ? oKeys.map(k => grp('o:' + k, k, oGroups[k].length, '',
        '<tr><th>Item (ID)</th><th>Raum</th><th>Control4-Proxy / Treiber</th><th>Profil</th><th></th></tr>' + oGroups[k].map(oRow).join(''))).join('') : ''}
    </div>`;

  });
  const num = (id, dflt) => { const v = parseFloat($(id).value); return isNaN(v) ? dflt : v; };
  const body = {
    enabled: $('#v-enabled').checked,
    port: parseInt($('#v-port').value, 10) || 8090,
    mics,
    wake: { enabled: $('#v-wake').checked, model: $('#v-wmodel').value || 'hey_jarvis',

    llm: { url: $('#v-llmurl').value.trim() || 'http://localhost:11434', model: $('#v-llmmodel').value.trim(),
           keep_alive_min: $('#v-llmka').value, num_ctx: $('#v-llmctx').value },
    bridge_url: $('#v-bridgeurl').value.trim() || 'http://127.0.0.1:8080',

      mittel: { up: num('#v-am-up', 50), down: num('#v-am-down', 50) },
      gross: { up: num('#v-ag-up', 100), down: num('#v-ag-down', 60) },
      cozy_below: num('#v-cozy-below', 30), cozy_down: num('#v-cozy-down', 25),
      min_level: num('#v-minlevel', 5) },
    music: { steps: { klein: num('#m-klein', 5), mittel: num('#m-mittel', 10), gross: num('#m-gross', 20) },
      max_volume: num('#m-max', 60) },
    prompts: promptBody(),
    assist: {
      weather: { enabled: $('#a-w-on').checked, place: $('#a-place').value.trim(),
        lat: $('#a-lat').value === '' ? null : +$('#a-lat').value, lon: $('#a-lon').value === '' ? null : +$('#a-lon').value },
      web: { enabled: $('#a-web-on').checked, provider: $('#a-prov').value, searxng_url: $('#a-sx').value.trim(),
        results: parseInt($('#a-n').value, 10) || 5 },
      answer_llm: { url: $('#a-llmurl').value.trim(), model: $('#a-llmmodel').value.trim(),
                    keep_alive_min: $('#a-llmka').value, num_ctx: $('#a-llmctx').value } },
    tts: { enabled: $('#t-enabled').checked, followup: $('#t-followup').checked, mode: $('#t-mode').value,
      engine: $('#t-eng').value, ...($('#t-pvoice').value ? { pocket: { voice: $('#t-pvoice').value } } : {}), qwen: { dir: $('#t-qdir').value.trim(), model: $('#t-qmodel').value, ref: $('#t-qref').value.trim(), ref_text: $('#t-qtext').value.trim() },
      speed: +$('#t-speed').value, volume: +$('#t-volume').value,
      ...($('#t-voice').value ? { voice: $('#t-voice').value } : {}) } };
  // c4voice liest diese Werte nur beim Start (Spracherkennung, Wake-Word, Port, Bridge-Adresse) – alles andere sofort
  const old = voiceCfgCache || {};
  const pick = (o, path) => path.split('.').reduce((x, k) => (x || {})[k], o);
  const RESTART = { 'port': 'Port', 'bridge_url': 'Bridge-URL', 'wake.enabled': 'Wake-Word an/aus', 'wake.model': 'Wake-Word-Modell',
    'stt.model': 'Spracherkennungs-Modell', 'stt.language': 'Sprache der Erkennung', 'stt.hint': 'Erkennungs-Hinweis' };
  const needs = Object.entries(RESTART).filter(([k]) => String(pick(old, k) ?? '') !== String(pick(body, k) ?? '')).map(([, l]) => l);
  try {
    if ($('#a-exa') && $('#a-exa').value) { await put('/api/config', { exa_key: $('#a-exa').value }); $('#a-exa').value = ''; }

    if (needs.length && body.enabled && Object.keys(old).length &&
        confirm(`Gespeichert. Diese Änderung wirkt erst nach einem Neustart des Sprachdienstes:\n• ${needs.join('\n• ')}\n\nJetzt neu starten?`)) {
      m.textContent = 'Sprachdienst wird neu gestartet …';
      try { await post('/api/voice/restart'); m.textContent = 'Gespeichert ✓ – Sprachdienst neu gestartet'; }
      catch (e) { m.textContent = 'Gespeichert, Neustart fehlgeschlagen: ' + e.message; }
    } else if (needs.length) {
      m.textContent = 'Gespeichert ✓ – wirkt nach „Neustart“ des Sprachdienstes (' + needs.join(', ') + ')';
    }
    setTimeout(loadVoiceBox, 2500);
  } catch (e) { m.textContent = 'Fehler: ' + e.message; }
  setTimeout(() => m.textContent = '', 4000);
}

async function loadWsBox() {
  const box = $('#wsbox'); if (!box) return;
  try {
    const [w, c] = await Promise.all([api('/api/ws/status'), api('/api/state/status').catch(() => null)]);
    const pf = c ? `<div class="row"><span class="hint"><span class="dot ${c.push ? 'ok' : 'bad'}"></span>
        Push-first: <b>${c.push ? 'aktiv' : 'aus – Abfrage alle ' + c.ttl_s + ' s'}</b> · ${c.loads} Director-Abrufe ·
        ${c.hits} aus Zwischenspeicher · ${c.events} Ereignisse ausgewertet (${c.ignored} ignoriert) ·
        ${c.subscribers} Oberfläche(n) verbunden${c.ui_agent ? ' · UI-Agent #' + c.ui_agent : ''}</span></div>` : '';
    box.innerHTML = pf + `
      <div class="row"><span><span class="dot ${w.connected ? 'ok' : 'bad'}"></span><b>${w.connected ? 'verbunden' : 'getrennt'}</b>
        <span class="hint">· ${w.subscribed_items} Items abonniert · ${w.events_total} Events · Token-Erneuerung alle ${Math.round(w.token_refresh_s / 3600)} h</span></span>

        <button class="act" onclick="wsAction('restart')">Neu verbinden</button>

        <span id="ws-msg" class="hint"></span></div>
      ${w.last_error ? `<div class="row"><span class="small" style="color:var(--err)">${esc(w.last_error)}</span></div>` : ''}
      <div class="row"><label class="hint"><input type="checkbox" ${w.discover ? 'checked' : ''} ${w.tap_ok ? '' : 'disabled'} onchange="wsDiscover(this.checked)">
        Diagnose: <b>alle</b> Director-Ereignisse mitschneiden (Standard aus)</label>
        ${w.discover ? `<span class="hint">· seit ${new Date(w.discover_since * 1000).toLocaleTimeString('de-DE')} · ${w.discover_senders} Absender</span>

        ${w.tap_ok ? '' : '<span class="hint" style="color:var(--warn)">nicht verfügbar (pyControl4-Version)</span>'}</div>

}

        <span class="hint">${esc(c.room)} · #${c.id}${c.manual ? ' · manuell' : ''}</span></div>
      <div class="row">
        <select id="cm-${c.id}" onchange="saveCam(${c.id})" style="width:200px">
          <option value="snapshot" ${c.mode === 'snapshot' ? 'selected' : ''}>Snapshot (Standbild)</option>
          <option value="rtsp" ${c.mode === 'rtsp' ? 'selected' : ''}>RTSP-Livestream</option>
        </select>
        <input type="text" id="cu-${c.id}" value="${esc(c.rtsp_url)}" placeholder="rtsp://192.168.1.60/live.sdp" style="flex:1 1 260px">
      </div>
      <div class="row">
        <input type="text" id="cU-${c.id}" value="${esc(c.rtsp_user)}" placeholder="Benutzer" style="width:150px">
        <input type="password" id="cp-${c.id}" placeholder="${c.pass_set ? 'gesetzt – leer lassen = unverändert' : 'Passwort'}" autocomplete="new-password" style="width:190px">
        <button class="act" onclick="saveCam(${c.id})">Speichern</button>
        <button class="act" onclick="testCam(${c.id})">Testen</button>
        ${c.manual ? `<button class="act danger" onclick="delCam(${c.id})">Löschen</button>` : ''}
        <span class="hint" id="cmsg-${c.id}"></span>
      </div>
    </div>`).join('') +
    `<p class="hint" style="margin:14px 0 0">Zugangsdaten liegen lokal in data/cameras.json und werden nie an den Browser zurückgegeben.
      RTSP-Modus nutzt den Livestream direkt von der Kamera („Testen“ prüft die Verbindung).</p>`;
}
async function addCam() {
  const msg = $('#nc-msg');
  try {
    const r = await post('/api/cameras/manual', {
      name: $('#nc-name').value, rtsp_url: $('#nc-url').value,
      rtsp_user: $('#nc-user').value, rtsp_pass: $('#nc-pass').value });
    msg.textContent = `angelegt ✓ (#${r.id})`;
    loadCamAdmin();
  } catch (e) { msg.textContent = 'Fehler: ' + e.message; }
}
async function delCam(id) {
  if (!confirm('Kamera entfernen?')) return;
  await api('/api/cameras/manual/' + id, { method: 'DELETE' });
  loadCamAdmin();
}
async function saveCam(id) {
  const body = { mode: $('#cm-' + id).value, rtsp_url: $('#cu-' + id).value, rtsp_user: $('#cU-' + id).value };
  if ($('#cp-' + id).value) body.rtsp_pass = $('#cp-' + id).value;
  await put('/api/cameras/config/' + id, body);
  $('#cmsg-' + id).textContent = 'gespeichert ✓';
  setTimeout(() => { $('#cmsg-' + id).textContent = ''; }, 2500);
}
async function testCam(id) {
  const m = $('#cmsg-' + id);
  m.textContent = 'teste …';
  try {
    const body = { rtsp_url: $('#cu-' + id).value, rtsp_user: $('#cU-' + id).value };
    if ($('#cp-' + id).value) body.rtsp_pass = $('#cp-' + id).value;
    const r = await post('/api/cameras/' + id + '/test', body);
    m.textContent = (r.ok ? '✓ ' : '✗ ') + r.result + (r.hint ? ' – ' + r.hint : '');
  } catch (e) { m.textContent = 'Fehler: ' + e.message; }
}
async function saveTheme(v) {
  await put('/api/me/prefs', { theme: v });
  try { localStorage.setItem('c4theme', v); } catch { }
  const m = $('#c-msg'); if (m) m.textContent = 'Theme gespeichert ✓ (gilt beim nächsten Öffnen der Bedienoberfläche)';
}
async function scanNow() {
  const m = $('#scan-msg'); m.textContent = 'scannt …';
  try {
    const r = await post('/api/scan');
    m.textContent = `✓ ${r.rooms} Räume, ${r.devices} Geräte${r.new_devices ? `, ${r.new_devices} NEU` : ''}, ${r.ws_items} Push-Abos`;
  } catch (e) { m.textContent = 'Fehler: ' + e.message; }
}

// ---- Räume ------------------------------------------------------------------------
// Lautstärke-Aktualisierung je Raum: direkt (Ereignis) / nachlesen / polling (orange) / – (kein Lautstärke-Gerät)
function volModeHtml(m) {
  if (!m || m.kind === 'none') return '<span class="hint">–</span>';
  const out = m.output ? ` · Ausgang ${m.output}${m.check ? ' (' + m.check + ')' : ''}` : '';
  const why = m.why ? `<div class="hint">${esc(m.why)}</div>` : '';
  return { direkt: `<span class="tag ok">direkt</span>${out}`, nachlesen: `<span class="tag">nachlesen</span>${out}${why}`,
           polling: `<span class="tag warn">nur Polling</span>${why}` }[m.kind] || esc(m.kind);
}
async function loadRoomAdmin() {
  const [rooms, vm] = await Promise.all([api('/api/rooms'), api('/api/state/rooms').catch(() => ({}))]);
  const floors = [];
  for (const r of rooms) {
    let g = floors.find(x => x.floor === r.floor);
    if (!g) { g = { floor: r.floor, items: [] }; floors.push(g); }
    g.items.push(r);
  }
  $('#roomsPanel').innerHTML = `
    <div class="panel">
      <h2 class="sec">Räume – Sichtbarkeit</h2>
      <p class="hint" style="margin:0 0 12px">Vorauswahl = Composer-Einstellung („roomHidden/tempHidden“). Die Schalter speichern sofort.
        Lieblingsräume legt jeder Benutzer selbst fest (Stern in der Raumliste der Bedienoberfläche).</p>
      <div class="scroll"><table>
        <tr><th>Raum</th><th>Ebene</th><th>sichtbar</th><th>Lautstärke</th><th>Push-Quellen</th></tr>
        ${floors.map(g => g.items.map(r => `<tr data-id="${r.id}" class="${(vm[r.id] || {}).kind === 'polling' ? 'poll' : ''}">
          <td>${esc(r.name)}${r.hidden ? ' <span class="tag" title="in Composer als versteckt markiert">Composer: versteckt</span>' : ''}</td>
          <td>${esc(r.floor)}</td>
          <td><label class="sw"><input type="checkbox" class="r-enabled" ${r.enabled ? 'checked' : ''} onchange="saveRoom(${r.id}, this)"><i></i></label></td>
          <td class="small">${volModeHtml(vm[r.id])}</td>
          <td><button class="act" onclick="roomPush(${r.id}, this)">▸ anzeigen</button></td>
        </tr><tr class="pushrow" id="push-${r.id}" hidden><td colspan="5"></td></tr>`).join('')).join('')}
      </table></div>
      <p class="hint" style="margin:10px 0 0"><span class="tag warn">nur Polling</span> = das Lautstärke-Gerät meldet nichts →
        die Oberfläche sieht Änderungen erst beim nächsten Abfragen (5–15 s). „nachlesen" = Ereignis kommt, der Raum wird dann gelesen.</p>
    </div>`;
}
// Push-Quellen eines Raums: Quelle, Lautstärke-Endpunkt (direkt/nachlesen), Pfade, letzte Ereignisse (nur lesend)
async function roomPush(id, btn) {
  const row = $('#push-' + id), cell = row.firstElementChild;
  if (!row.hidden) { row.hidden = true; btn.textContent = '▸ anzeigen'; return; }
  row.hidden = false; btn.textContent = '▾ ausblenden'; cell.innerHTML = '<span class="hint">lese Raum …</span>';
  try {
    const d = await api(`/api/rooms/${id}/push`);
    const dev = x => x ? `<b>${esc(x.name || '?')}</b> <span class="hint">#${x.id}${x.proxy ? ' · ' + esc(x.proxy) : ''}</span>` : '<span class="hint">–</span>';
    const ago = t => t ? Math.max(0, Math.round(Date.now() / 1000 - t)) + ' s' : '';
    const chain = p => p && p.length ? p.map(x => `${dev(x)} <span class="hint">(ein ${x.in || '–'} · aus ${x.out || '–'})</span>`).join(' → ') : '<span class="hint">– (Raum aus)</span>';
    const v = d.volume;
    cell.innerHTML = `<div class="pushbox">
      <div><span class="hint">Status</span> ${d.on ? '<b>an</b>' : 'aus'} · Push ${d.push ? '✓' : '<span style="color:var(--warn)">aus – Abfrage</span>'}
        · Raum an/aus über ${d.ui_agent ? dev(d.ui_agent) : '<span class="hint">UI-Agent noch nicht gesehen</span>'}</div>
      <div><span class="hint">Quelle</span> ${dev(d.source)} <span class="hint">– Titel/Play-Pause per Ereignis dieses Geräts, Quellwechsel per Raum-Ereignis bzw. alle 5 s</span></div>
      <div><span class="hint">Lautstärke / Stumm</span> ${v ? `${dev(v)} · <b>${{ direkt: 'direkt aus Ereignis', nachlesen: 'Raum nachlesen', polling: 'nur Polling' }[v.mode] || v.mode}${v.output ? ` (Ausgang ${v.output}${v.check ? ', ' + v.check : ''})` : ''}</b>
        ${v.why ? `<span class="hint">– ${esc(v.why)}</span>` : ''}
        ${v.shared_with && v.shared_with.length ? `<span class="hint">(auch Räume ${v.shared_with.join(', ')})</span>` : ''}
        ${v.at ? `<span class="hint">· zuletzt ${v.volume ?? ''}${v.muted ? ' stumm' : ''} vor ${ago(v.at)}</span>` : '<span class="hint">· noch kein Ereignis</span>'}`
        : '<span class="hint">kein Lautstärke-Gerät bekannt (Raum noch nie an gesehen)</span>'}</div>
      <div><span class="hint">Laut Composer</span> ${Object.keys(d.static || {}).length ? Object.entries(d.static).map(([k, l]) =>
        `${{ volume: 'Lautstärke', video_volume: 'Lautstärke Sehen', audio_endpoint: 'Audio-Endpunkt', video_endpoint: 'Video-Endpunkt',
             video_audio_endpoint: 'Ton beim Sehen' }[k] || k}: ${l.map(dev).join(', ')}`).join(' · ') : '<span class="hint">keine Endpunkt-Bindungen</span>'}</div>
      <div><span class="hint">Audio-Pfad</span> ${chain(d.paths.audio_path)}</div>
      ${d.paths.video_path.length ? `<div><span class="hint">Video-Pfad</span> ${chain(d.paths.video_path)}</div>` : ''}
      ${d.paths.video_audio_path.length ? `<div><span class="hint">Ton beim Sehen</span> ${chain(d.paths.video_audio_path)}</div>` : ''}
      <div><span class="hint">Letzte Ereignisse</span> ${d.log.length ? d.log.map(e => `<div class="small">vor ${ago(e.t)} · ${esc(e.name || '#' + e.dev)}: ${esc(e.what)}</div>`).join('')
        : '<span class="hint">seit dem Start noch keine</span>'}</div></div>`;
  } catch (e) { cell.innerHTML = '<span class="hint">Fehler: ' + esc(e.message) + '</span>'; }
}
async function saveRoom(id, el) {
  const tr = el.closest('tr');
  el.disabled = true;
  try {
    await put('/api/rooms/' + id, { enabled: $('.r-enabled', tr).checked });
  } finally { el.disabled = false; }
}

// ---- Projektdaten (Baum) -----------------------------------------------------------
let treeData = null, treeFilter = '', treeSel = null;
const collapsed = { floors: new Set(), rooms: new Set() };   // Auf-/Zuklapp-Merker
const devIcon = t => ic(({ light: 'light_on', blind: 'blind_open', thermostat: 'thermostat', media: 'music',
  contact: 'window_closed', motion: 'motion', camera: 'camera' })[t] || 'gear', 16);
const toggleSet = (s, k) => s.has(k) ? s.delete(k) : s.add(k);

async function loadTree() {
  treeData = await api('/api/tree');
  renderTree();
}

function renderTree() {
  $('#t-tree').innerHTML = `
    <div class="treewrap">
      <div class="panel">
        <input type="search" id="treeq" placeholder="Gerät / Raum / Ebene suchen …" value="${esc(treeFilter)}"
               oninput="treeFilter=this.value;renderTreeList()" style="width:100%">
        <div id="treelist" class="treelist"></div>
      </div>
      <div class="panel" id="devprops"><p class="muted">Links ein Gerät oder Raum auswählen, um alle Properties live vom Director zu sehen.</p></div>
    </div>`;
  renderTreeList();
}

function renderTreeList() {
  const q = treeFilter.trim().toLowerCase();
  const searching = !!q;   // bei Suche alles aufklappen
  let html = '';
  for (const [floor, rooms] of Object.entries(treeData.floors)) {
    const roomsHtml = rooms.filter(r => !q || r.name.toLowerCase().includes(q) || floor.toLowerCase().includes(q)
      || r.devices.some(d => (d.name + ' ' + (d.proxy || '') + ' ' + (d.note || '')).toLowerCase().includes(q)))
      .map(r => {
        const devs = r.devices.filter(d => !q || r.name.toLowerCase().includes(q) || floor.toLowerCase().includes(q)
          || (d.name + ' ' + (d.proxy || '') + ' ' + (d.type || '')).toLowerCase().includes(q));
        const roomOpen = searching || !collapsed.rooms.has(r.id);
        return `<button class="troom" onclick="toggleSet(collapsed.rooms,${r.id});renderTreeList()">
            <span class="tw">${roomOpen ? '▾' : '▸'}</span> ${esc(r.name)} ${r.favorite ? '★' : ''}
            <span class="hint">#${r.id}${r.enabled ? '' : ' · ausgeblendet'} · ${r.devices.length} Geräte</span></button>` +
          (roomOpen ? `<div style="padding-left:14px">` + devs.map(d => `<button class="tdev${treeSel === d.id ? ' sel' : ''}" onclick="showDev(${d.id})">
            ${devIcon(d.type)} ${esc(d.name)} <span class="hint">#${d.id}</span></button>`).join('') + `</div>` : '');
      }).join('');
    if (roomsHtml) {
      const floorOpen = searching || !collapsed.floors.has(floor);
      html += `<button class="tflo" onclick="toggleSet(collapsed.floors,'${esc(floor)}');renderTreeList()">
          <span class="tw">${floorOpen ? '▾' : '▸'}</span> ${esc(floor)}</button>` +
        (floorOpen ? `<div style="padding-left:10px">${roomsHtml}</div>` : '');
    }
  }
  $('#treelist').innerHTML = html || '<p class="muted">nichts gefunden</p>';
}

const kvTable = (obj, skip = []) => !obj ? '<p class="muted">–</p>' :
  `<table><tbody>${Object.entries(obj)
    .filter(([k]) => !skip.includes(k) && typeof obj[k] !== 'object')
    .map(([k, v]) => `<tr><th style="width:40%">${esc(k)}</th><td>${esc(String(v))}</td></tr>`).join('')}</tbody></table>`;

async function showDev(id) {
  treeSel = id;
  document.querySelectorAll('.tdev').forEach(b => b.classList.toggle('sel', b.getAttribute('onclick') === `showDev(${id})`));
  $('#devprops').innerHTML = '<p class="muted">lade …</p>';
  const d = await api(`/api/devices/${id}/inspect`);
  const invd = d.inventory || {};
  $('#devprops').innerHTML = `
    <div class="row" style="justify-content:space-between">
      <h2 class="sec" style="margin:0">${devIcon(invd.type)} ${esc(invd.name || invd.room || '?')} <span class="muted">#${id}</span></h2>
      <button class="act" onclick="showDev(${id})">↻ neu laden</button>
    </div>
    <div class="sect"><h2 class="sec">Inventar (Bridge)</h2>${kvTable(invd)}</div>
    <div class="sect"><h2 class="sec">Director-Item-Info</h2>${kvTable(d.item_info, ['data'])}</div>
    <div class="sect"><h2 class="sec">Variablen (live)</h2>
    ${d.variables && !d.variables.error
      ? (Array.isArray(d.variables)
          ? kvTable(Object.fromEntries(d.variables.map(v => [v.varName ?? v.name ?? '?', v.value ?? v])))
          : kvTable(d.variables))
      : `<p class="muted">${esc(String(d.variables?.error || 'keine'))}</p>`}</div>`;
}

async function wsAction(a) {
  const m = $('#ws-msg'); if (m) m.textContent = '…';
  try {
    const r = await post('/api/ws/' + a);
    if (m) m.textContent = a === 'restart' ? 'Reconnect gestartet ✓' : `wieder abonniert: ${r.subscribed_items} Items ✓`;
  } catch (e) { if (m) m.textContent = 'Fehler: ' + e.message; }
  setTimeout(loadWsBox, 2500);
}

loadStatus(); setInterval(() => { if (current === 'status') loadStatus(); }, 5000);
</script>
</body>
</html>
